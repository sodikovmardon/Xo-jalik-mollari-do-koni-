<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="crane1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2240"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1f0e"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="50" cy="40" r="1.2" fill="#fff" opacity=".5"/><circle cx="120" cy="65" r="1" fill="#fff" opacity=".4"/>
  <circle cx="200" cy="30" r="1.5" fill="#fff" opacity=".6"/><circle cx="350" cy="55" r="1" fill="#fff" opacity=".3"/>
  <circle cx="500" cy="25" r="1.2" fill="#fff" opacity=".5"/><circle cx="650" cy="50" r="1" fill="#fff" opacity=".4"/>
  <circle cx="720" cy="35" r="1.5" fill="#fff" opacity=".5"/>
  <!-- Moon -->
  <circle cx="700" cy="70" r="28" fill="#e8e8e8" opacity=".15"/>
  <circle cx="708" cy="64" r="24" fill="url(#sky)"/>
  <!-- Building under construction -->
  <rect x="480" y="120" width="140" height="330" fill="url(#bldg)" rx="2"/>
  <rect x="490" y="135" width="20" height="18" fill="#0a84ff" opacity=".3" rx="1"/>
  <rect x="520" y="135" width="20" height="18" fill="#0a84ff" opacity=".2" rx="1"/>
  <rect x="550" y="135" width="20" height="18" fill="#0a84ff" opacity=".4" rx="1"/>
  <rect x="580" y="135" width="20" height="18" fill="#0a84ff" opacity=".15" rx="1"/>
  <rect x="490" y="165" width="20" height="18" fill="#0a84ff" opacity=".2" rx="1"/>
  <rect x="520" y="165" width="20" height="18" fill="#0a84ff" opacity=".35" rx="1"/>
  <rect x="550" y="165" width="20" height="18" fill="#0a84ff" opacity=".15" rx="1"/>
  <rect x="580" y="165" width="20" height="18" fill="#0a84ff" opacity=".3" rx="1"/>
  <rect x="490" y="195" width="20" height="18" fill="#0a84ff" opacity=".35" rx="1"/>
  <rect x="520" y="195" width="20" height="18" fill="#0a84ff" opacity=".15" rx="1"/>
  <rect x="550" y="195" width="20" height="18" fill="#0a84ff" opacity=".3" rx="1"/>
  <rect x="580" y="195" width="20" height="18" fill="#0a84ff" opacity=".2" rx="1"/>
  <rect x="490" y="225" width="20" height="18" fill="#0a84ff" opacity=".15" rx="1"/>
  <rect x="520" y="225" width="20" height="18" fill="#0a84ff" opacity=".3" rx="1"/>
  <rect x="550" y="225" width="20" height="18" fill="#0a84ff" opacity=".2" rx="1"/>
  <rect x="580" y="225" width="20" height="18" fill="#0a84ff" opacity=".35" rx="1"/>
  <!-- Scaffolding on building -->
  <line x1="475" y1="130" x2="475" y2="350" stroke="#f59e0b" stroke-width="1.5" opacity=".6"/>
  <line x1="625" y1="130" x2="625" y2="350" stroke="#f59e0b" stroke-width="1.5" opacity=".6"/>
  <line x1="475" y1="160" x2="625" y2="160" stroke="#f59e0b" stroke-width="1" opacity=".4"/>
  <line x1="475" y1="200" x2="625" y2="200" stroke="#f59e0b" stroke-width="1" opacity=".4"/>
  <line x1="475" y1="240" x2="625" y2="240" stroke="#f59e0b" stroke-width="1" opacity=".4"/>
  <!-- Crane -->
  <rect x="310" y="60" width="8" height="390" fill="url(#crane1)" rx="2"/>
  <rect x="200" y="60" width="320" height="6" fill="url(#crane1)" rx="2"/>
  <line x1="314" y1="60" x2="314" y2="30" stroke="#f59e0b" stroke-width="3"/>
  <!-- Crane cable -->
  <line x1="500" y1="66" x2="500" y2="110" stroke="#94a3b8" stroke-width="1.5" opacity=".6"/>
  <!-- Crane hook -->
  <rect x="495" y="105" width="10" height="15" fill="#94a3b8" opacity=".6" rx="2"/>
  <path d="M498 120 L502 120 L500 128 Z" fill="#94a3b8" opacity=".6"/>
  <!-- Crane wheels/base -->
  <rect x="290" y="435" width="50" height="15" fill="#374151" rx="4"/>
  <circle cx="300" cy="450" r="6" fill="#4b5563"/>
  <circle cx="330" cy="450" r="6" fill="#4b5563"/>
  <!-- Left smaller building -->
  <rect x="80" y="240" width="100" height="210" fill="#162a45" rx="2"/>
  <rect x="90" y="255" width="16" height="14" fill="#0a84ff" opacity=".25" rx="1"/>
  <rect x="115" y="255" width="16" height="14" fill="#0a84ff" opacity=".15" rx="1"/>
  <rect x="140" y="255" width="16" height="14" fill="#0a84ff" opacity=".3" rx="1"/>
  <rect x="90" y="280" width="16" height="14" fill="#0a84ff" opacity=".15" rx="1"/>
  <rect x="115" y="280" width="16" height="14" fill="#0a84ff" opacity=".3" rx="1"/>
  <rect x="140" y="280" width="16" height="14" fill="#0a84ff" opacity=".2" rx="1"/>
  <rect x="90" y="305" width="16" height="14" fill="#0a84ff" opacity=".3" rx="1"/>
  <rect x="115" y="305" width="16" height="14" fill="#0a84ff" opacity=".15" rx="1"/>
  <rect x="140" y="305" width="16" height="14" fill="#0a84ff" opacity=".25" rx="1"/>
  <!-- Material stacks on ground -->
  <rect x="200" y="400" width="60" height="35" fill="#8b5e3c" rx="2" opacity=".7"/>
  <rect x="200" y="400" width="60" height="5" fill="#a0704e" rx="1" opacity=".5"/>
  <rect x="270" y="410" width="40" height="25" fill="#d97706" rx="2" opacity=".5"/>
  <!-- Ground -->
  <rect x="0" y="430" width="800" height="20" fill="url(#ground)"/>
  <!-- Accent glow -->
  <ellipse cx="314" cy="300" rx="200" ry="100" fill="#0a84ff" opacity=".03"/>
