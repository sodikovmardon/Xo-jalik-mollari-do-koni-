<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="bag1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4d4d8"/><stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="bag2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/><stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <!-- Warehouse floor -->
  <rect x="0" y="380" width="800" height="70" fill="#1f2937" rx="0"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#374151" stroke-width="1"/>
  <!-- Pallet 1 -->
  <rect x="80" y="365" width="180" height="12" fill="url(#pallet)" rx="2"/>
  <rect x="90" y="377" width="10" height="25" fill="#78350f" rx="1"/>
  <rect x="250" y="377" width="10" height="25" fill="#78350f" rx="1"/>
  <!-- Cement bags stack on pallet 1 -->
  <g>
    <!-- Bottom row -->
    <rect x="85" y="310" width="55" height="25" fill="url(#bag1)" rx="3" stroke="#a1a1aa" stroke-width=".5"/>
    <rect x="85" y="310" width="55" height="8" fill="#e4e4e7" rx="2" opacity=".4"/>
    <text x="112" y="328" text-anchor="middle" fill="#52525b" font-size="7" font-weight="bold">CEMENT</text>
    <rect x="145" y="310" width="55" height="25" fill="url(#bag1)" rx="3" stroke="#a1a1aa" stroke-width=".5"/>
    <rect x="145" y="310" width="55" height="8" fill="#e4e4e7" rx="2" opacity=".4"/>
    <text x="172" y="328" text-anchor="middle" fill="#52525b" font-size="7" font-weight="bold">CEMENT</text>
    <rect x="205" y="310" width="55" height="25" fill="url(#bag1)" rx="3" stroke="#a1a1aa" stroke-width=".5"/>
    <rect x="205" y="310" width="55" height="8" fill="#e4e4e7" rx="2" opacity=".4"/>
    <text x="232" y="328" text-anchor="middle" fill="#52525b" font-size="7" font-weight="bold">CEMENT</text>
    <!-- Top row -->
    <rect x="115" y="282" width="55" height="25" fill="url(#bag1)" rx="3" stroke="#a1a1aa" stroke-width=".5"/>
    <rect x="115" y="282" width="55" height="8" fill="#e4e4e7" rx="2" opacity=".4"/>
    <text x="142" y="300" text-anchor="middle" fill="#52525b" font-size="7" font-weight="bold">50 KG</text>
    <rect x="175" y="282" width="55" height="25" fill="url(#bag1)" rx="3" stroke="#a1a1aa" stroke-width=".5"/>
    <rect x="175" y="282" width="55" height="8" fill="#e4e4e7" rx="2" opacity=".4"/>
    <text x="202" y="300" text-anchor="middle" fill="#52525b" font-size="7" font-weight="bold">50 KG</text>
  </g>
  <!-- Pallet 2 (yellow bags) -->
  <rect x="350" y="365" width="180" height="12" fill="url(#pallet)" rx="2"/>
  <rect x="360" y="377" width="10" height="25" fill="#78350f" rx="1"/>
  <rect x="520" y="377" width="10" height="25" fill="#78350f" rx="1"/>
  <!-- Yellow bags -->
  <g>
    <rect x="355" y="310" width="55" height="25" fill="url(#bag2)" rx="3" stroke="#d97706" stroke-width=".5"/>
    <rect x="355" y="310" width="55" height="8" fill="#fcd34d" rx="2" opacity=".5"/>
    <text x="382" y="328" text-anchor="middle" fill="#78350f" font-size="7" font-weight="bold">GIPS</text>
    <rect x="415" y="310" width="55" height="25" fill="url(#bag2)" rx="3" stroke="#d97706" stroke-width=".5"/>
    <rect x="415" y="310" width="55" height="8" fill="#fcd34d" rx="2" opacity=".5"/>
    <text x="442" y="328" text-anchor="middle" fill="#78350f" font-size="7" font-weight="bold">GIPS</text>
    <rect x="475" y="310" width="55" height="25" fill="url(#bag2)" rx="3" stroke="#d97706" stroke-width=".5"/>
    <rect x="475" y="310" width="55" height="8" fill="#fcd34d" rx="2" opacity=".5"/>
    <text x="502" y="328" text-anchor="middle" fill="#78350f" font-size="7" font-weight="bold">50 KG</text>
    <rect x="385" y="282" width="55" height="25" fill="url(#bag2)" rx="3" stroke="#d97706" stroke-width=".5"/>
    <rect x="385" y="282" width="55" height="8" fill="#fcd34d" rx="2" opacity=".5"/>
    <text x="412" y="300" text-anchor="middle" fill="#78350f" font-size="7" font-weight="bold">GIPS</text>
    <rect x="445" y="282" width="55" height="25" fill="url(#bag2)" rx="3" stroke="#d97706" stroke-width=".5"/>
    <rect x="445" y="282" width="55" height="8" fill="#fcd34d" rx="2" opacity=".5"/>
    <text x="472" y="300" text-anchor="middle" fill="#78350f" font-size="7" font-weight="bold">50 KG</text>
  </g>
  <!-- Sand pile -->
  <ellipse cx="680" cy="375" rx="90" ry="30" fill="#92702a"/>
  <ellipse cx="680" cy="365" rx="85" ry="25" fill="#a68334"/>
  <ellipse cx="680" cy="355" rx="75" ry="20" fill="#b89440"/>
  <!-- Shovel stuck in sand -->
  <g transform="translate(660,280) rotate(15)">
    <rect x="0" y="0" width="6" height="100" fill="#8b6914" rx="2"/>
    <path d="M-10 95 L16 95 L8 120 L-2 120 Z" fill="#6b7280"/>
  </g>
  <!-- Forklift silhouette in background -->
  <g transform="translate(650,200)" opacity=".15">
    <rect x="0" y="30" width="50" height="40" fill="#fff" rx="3"/>
    <rect x="10" y="0" width="30" height="30" fill="#fff" rx="2"/>
    <rect x="55" y="50" width="8" height="30" fill="#fff" rx="1"/>
    <rect x="55" y="70" width="40" height="5" fill="#fff" rx="1"/>
    <circle cx="10" cy="75" r="7" fill="#fff"/><circle cx="40" cy="75" r="7" fill="#fff"/>
  </g>
  <!-- Ambient light -->
  <ellipse cx="400" cy="300" rx="350" ry="150" fill="#0a84ff" opacity=".02"/>
</svg>