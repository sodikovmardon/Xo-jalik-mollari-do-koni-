<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1d5db"/><stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0703c"/><stop offset="100%" stop-color="#7a5428"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>
  <!-- Workbench -->
  <rect x="50" y="320" width="700" height="18" fill="url(#wood)" rx="3"/>
  <rect x="80" y="338" width="12" height="90" fill="#5c3a18" rx="2"/>
  <rect x="710" y="338" width="12" height="90" fill="#5c3a18" rx="2"/>
  <!-- Wrench -->
  <g transform="translate(120,220) rotate(-15)">
    <rect x="0" y="0" width="12" height="100" fill="url(#steel)" rx="3"/>
    <circle cx="6" cy="6" r="14" fill="none" stroke="url(#steel)" stroke-width="6"/>
    <circle cx="6" cy="6" r="8" fill="url(#bg4)"/>
    <ellipse cx="6" cy="98" rx="8" ry="12" fill="url(#steel)"/>
  </g>
  <!-- Hammer -->
  <g transform="translate(240,200) rotate(10)">
    <rect x="0" y="15" width="8" height="105" fill="url(#wood)" rx="2"/>
    <rect x="-10" y="0" width="28" height="22" fill="url(#steel)" rx="3"/>
    <rect x="12" y="5" width="14" height="12" fill="url(#steel)" rx="2"/>
  </g>
  <!-- Screwdriver set -->
  <g transform="translate(360,240)">
    <rect x="0" y="0" width="7" height="80" fill="url(#rubber)" rx="2"/>
    <rect x="1" y="75" width="5" height="30" fill="url(#steel)" rx="1"/>
    <rect x="20" y="-5" width="7" height="85" fill="#3b82f6" rx="2"/>
    <rect x="21" y="75" width="5" height="35" fill="url(#steel)" rx="1"/>
    <rect x="40" y="5" width="7" height="75" fill="#eab308" rx="2"/>
    <rect x="41" y="75" width="5" height="28" fill="url(#steel)" rx="1"/>
    <rect x="60" y="-2" width="7" height="82" fill="#22c55e" rx="2"/>
    <rect x="61" y="75" width="5" height="32" fill="url(#steel)" rx="1"/>
  </g>
  <!-- Tape measure -->
  <g transform="translate(500,250)">
    <rect x="0" y="0" width="50" height="35" fill="#eab308" rx="5"/>
    <rect x="5" y="5" width="40" height="25" fill="#ca8a04" rx="3"/>
    <circle cx="25" cy="17" r="8" fill="#0a0f1c" stroke="#854d0e" stroke-width="1"/>
    <rect x="45" y="12" width="50" height="5" fill="#d4d4d8" rx="1"/>
    <rect x="80" y="10" width="3" height="9" fill="#d4d4d8" rx="1"/>
    <!-- Measurement marks on tape -->
    <line x1="50" y1="14" x2="50" y2="16" stroke="#52525b" stroke-width=".5"/>
    <line x1="55" y1="14" x2="55" y2="16" stroke="#52525b" stroke-width=".5"/>
    <line x1="60" y1="14" x2="60" y2="16" stroke="#52525b" stroke-width=".5"/>
    <line x1="65" y1="14" x2="65" y2="17" stroke="#52525b" stroke-width=".5"/>
    <line x1="70" y1="14" x2="70" y2="16" stroke="#52525b" stroke-width=".5"/>
    <line x1="75" y1="14" x2="75" y2="16" stroke="#52525b" stroke-width=".5"/>
  </g>
  <!-- Drill -->
  <g transform="translate(620,230)">
    <rect x="0" y="15" width="35" height="30" fill="#0a84ff" rx="4"/>
    <rect x="35" y="22" width="60" height="16" fill="url(#steel)" rx="2"/>
    <rect x="95" y="25" width="20" height="10" fill="#4b5563" rx="1"/>
    <polygon points="115,28 135,30 115,32" fill="#9ca3af"/>
    <!-- Battery pack -->
    <rect x="5" y="45" width="25" height="35" fill="#1e293b" rx="3"/>
    <rect x="8" y="48" width="19" height="5" fill="#22c55e" rx="1"/>
    <!-- Trigger -->
    <path d="M10 15 L10 45 L0 45 Z" fill="#0a84ff" opacity=".8"/>
  </g>
  <!-- Safety goggles -->
  <g transform="translate(150,340)">
    <ellipse cx="25" cy="15" rx="20" ry="15" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity=".6"/>
    <ellipse cx="65" cy="15" rx="20" ry="15" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity=".6"/>
    <path d="M45 15 Q50 10 55 15" fill="none" stroke="#60a5fa" stroke-width="2" opacity=".6"/>
    <line x1="5" y1="15" x2="-5" y2="10" stroke="#60a5fa" stroke-width="2" opacity=".4"/>
    <line x1="85" y1="15" x2="95" y2="10" stroke="#60a5fa" stroke-width="2" opacity=".4"/>
  </g>
  <!-- Pencil -->
  <g transform="translate(500,340) rotate(-5)">
    <rect x="0" y="0" width="6" height="60" fill="#eab308" rx="1"/>
    <polygon points="0,60 6,60 3,70" fill="#f5d68a"/>
    <rect x="0" y="0" width="6" height="8" fill="#1e293b" rx="1"/>
  </g>
  <!-- Ambient glow -->
  <ellipse cx="400" cy="280" rx="300" ry="120" fill="#0a84ff" opacity=".03"/>
</svg>