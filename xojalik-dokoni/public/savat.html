<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savatim — Qurilish Bazasi</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .cart-page { max-width: 720px; margin: 0 auto; padding: 32px 0 64px; }
  .cart-page h1 { font-size: 26px; margin-bottom: 24px; }
  .cart-item-row { display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; }
  .cart-item-row img { width: 64px; height: 64px; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; }
  .cart-item-row .info { flex: 1; min-width: 0; }
  .cart-item-row .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .cart-item-row .unit-price { color: var(--text-dim); font-size: 13px; }
  .cart-item-row .right { text-align: right; flex-shrink: 0; }
  .cart-item-row .line-total { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .cart-item-row .del-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 18px; padding: 6px; border-radius: var(--radius-sm); min-width: 36px; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; }
  .cart-item-row .del-btn:hover { background: var(--danger-bg); }
  .cart-item-row.unavailable { opacity: 0.5; }
  .cart-item-row.unavailable .name::after { content: ' (mavjud emas)'; color: var(--danger); font-size: 12px; }
  .cart-summary { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-top: 24px; }
  .cart-summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
  .cart-summary-row.total { font-size: 18px; font-weight: 700; margin-bottom: 20px; padding-top: 12px; border-top: 1px solid var(--border); }
  .cart-empty { text-align: center; padding: 80px 20px; }
  .cart-empty h3 { margin-bottom: 12px; }
  .cart-empty p { color: var(--text-dim); margin-bottom: 24px; }
  .cart-form { margin-top: 20px; }
  .cart-form .field { margin-bottom: 14px; }
  .cart-form label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; font-weight: 500; }
  .cart-form input { width: 100%; padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; outline: none; }
  .cart-form input:focus { border-color: var(--accent); }
  .form-msg { margin-top: 10px; font-size: 14px; display: none; }
  .form-msg.show { display: block; }
  .form-msg.error { color: var(--danger); }
  .form-msg.success { color: var(--ok); }
  .success-box { text-align: center; padding: 40px 20px; }
  .success-box .check { font-size: 48px; margin-bottom: 16px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="brand">
      <span class="brand-mark" id="brandMark"><svg id="brandLogo" viewBox="0 0 33 33" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="33" height="33" rx="11" fill="url(#bgrad)"/><path d="M8 10h17v3H8zm0 5h8v3H8zm9 0h8v3H9zm-9 5h17v3H8z" fill="rgba(255,255,255,.88)"/><defs><linearGradient id="bgrad" x1="0" y1="0" x2="33" y2="33"><stop stop-color="#4DA3FF"/><stop offset="1" stop-color="#0A84FF"/></linearGradient></defs></svg></span>
      <span class="brand-col"><span id="storeName">Qurilish Bazasi</span><span class="brand-sub" id="storeTagline">xo'jalik mollari do'koni</span></span>
    </a>
    <div class="nav-right">
      <nav class="nav-links" id="navLinks">
        <a href="/">Katalog</a>
      </nav>
      <a href="/savat" class="cart-icon-btn" title="Savat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-badge" id="cartCountBadge">0</span>
      </a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="cart-page">
    <a href="/" class="back-link">&larr; Katalogga qaytish</a>
    <h1>Savatim</h1>
    <div id="cartContent"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-brand">
      <span class="footer-logo" id="footerLogo"><svg viewBox="0 0 33 33" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="33" height="33" rx="11" fill="url(#bfgrad)"/><path d="M8 10h17v3H8zm0 5h8v3H8zm9 0h8v3H9zm-9 5h17v3H8z" fill="rgba(255,255,255,.88)"/><defs><linearGradient id="bfgrad" x1="0" y1="0" x2="33" y2="33"><stop stop-color="#4DA3FF"/><stop offset="1" stop-color="#0A84FF"/></linearGradient></defs></svg></span>
      <div>
        <span class="footer-name" id="footerName">Qurilish Bazasi</span>
        <span class="footer-desc">Xo'jalik va qurilish mollari do'koni.</span>
      </div>
    </div>
  </div>
  <div class="wrap footer-bottom">
    <span>&copy; 2026 Qurilish Bazasi. Barcha huquqlar himoyalangan.</span>
  </div>
</footer>

<script src="/cart.js"></script>
<script>
(function() {
  var content = document.getElementById('cartContent');
  var cartProducts = [];

  function render() {
    var cart = getCart();
    if (cart.length === 0) {
      content.innerHTML = '<div class="cart-empty"><h3>Savatingiz hozircha bo\'sh</h3><p>Katalogdan mahsulot tanlang va savatga qo\'shing.</p><a href="/" class="btn btn-primary">Katalogga o\'tish</a></div>';
      return;
    }

    var productIds = cart.map(function(i) { return i.product_id; });

    fetch('/api/v1/products')
      .then(function(r) { return r.json(); })
      .then(function(json) {
        var allProducts = json.data || [];
        cartProducts = allProducts.filter(function(p) { return productIds.indexOf(p.id) !== -1; });
        renderItems(cart, cartProducts);
      })
      .catch(function() {
        cartProducts = [];
        renderItems(cart, []);
      });
  }

  function renderItems(cart, products) {
    var fmt = new Intl.NumberFormat('uz-UZ');
    var totalQty = 0;
    var totalPrice = 0;
    var hasUnavailable = false;

    var itemsHtml = cart.map(function(cartItem) {
      var p = products.find(function(pr) { return pr.id === cartItem.product_id; });
      if (!p) {
        hasUnavailable = true;
        return '<div class="cart-item-row unavailable">' +
          '<img src="/uploads/placeholder-default.svg" alt="">' +
          '<div class="info"><div class="name">Mahsulot mavjud emas (ID: ' + cartItem.product_id + ')</div>' +
          '<div class="unit-price">O\'chirish uchun \u2212 ni bosing</div>' +
          '<div class="card-cart-wrap" style="margin-top:8px">' +
          '<div class="card-cart-stepper" data-product-id="' + cartItem.product_id + '">' +
          '<button class="stepper-btn stepper-minus" data-action="minus" data-id="' + cartItem.product_id + '" aria-label="Kamaytirish">\u2212</button>' +
          '<span class="stepper-qty">' + cartItem.miqdor + '</span>' +
          '<button class="stepper-btn stepper-plus" data-action="plus" data-id="' + cartItem.product_id + '" disabled>+</button>' +
          '</div></div></div>' +
          '<div class="right">' +
          '<button class="del-btn" data-action="delete" data-id="' + cartItem.product_id + '" title="O\'chirish">\u2715</button>' +
          '</div></div>';
      }

      var lineTotal = p.narx * cartItem.miqdor;
      totalQty += cartItem.miqdor;
      totalPrice += lineTotal;
      var atMax = cartItem.miqdor >= p.ombordagi_soni;

      return '<div class="cart-item-row" data-product-id="' + p.id + '" data-nomi="' + p.nomi + '" data-narx="' + p.narx + '" data-birlik="' + p.birlik + '" data-rasm="' + (p.rasm_url || '') + '" data-stock="' + p.ombordagi_soni + '">' +
        '<img src="' + (p.rasm_url || '/uploads/placeholder-default.svg') + '" alt="' + p.nomi + '" onerror="this.src=\'/uploads/placeholder-default.svg\'">' +
        '<div class="info">' +
          '<div class="name">' + p.nomi + '</div>' +
          '<div class="unit-price">' + fmt.format(p.narx) + ' so\'m / ' + p.birlik + '</div>' +
          '<div class="card-cart-wrap" style="margin-top:8px">' +
            '<div class="card-cart-stepper" data-product-id="' + p.id + '">' +
              '<button class="stepper-btn stepper-minus" data-action="minus" data-id="' + p.id + '" aria-label="Kamaytirish">\u2212</button>' +
              '<span class="stepper-qty">' + cartItem.miqdor + '</span>' +
              '<button class="stepper-btn stepper-plus" data-action="plus" data-id="' + p.id + '" aria-label="Ko\'paytirish"' + (atMax ? ' disabled' : '') + '>+</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="right">' +
          '<div class="line-total">' + fmt.format(lineTotal) + ' so\'m</div>' +
          '<button class="del-btn" data-action="delete" data-id="' + p.id + '" title="O\'chirish">\u2715</button>' +
        '</div>' +
      '</div>';
    }).join('');

    if (hasUnavailable) {
      totalQty = cart.reduce(function(s, i) { return s + i.miqdor; }, 0);
      totalPrice = 0;
      cart.forEach(function(ci) {
        var p = products.find(function(pr) { return pr.id === ci.product_id; });
        if (p) totalPrice += p.narx * ci.miqdor;
      });
    }

    content.innerHTML = itemsHtml +
      '<div class="cart-summary">' +
        '<div class="cart-summary-row"><span>Mahsulotlar soni:</span><span>' + totalQty + ' dona</span></div>' +
        '<div class="cart-summary-row total"><span>Jami summa:</span><span>' + fmt.format(totalPrice) + ' so\'m</span></div>' +
        '<form class="cart-form" id="orderFormWrap">' +
          '<div class="field"><label>Ismingiz</label><input type="text" id="c_mijoz_ismi" required placeholder="Masalan: Aziz Karimov"></div>' +
          '<div class="field"><label>Telefon raqamingiz</label><input type="tel" id="c_telefon" required placeholder="+998 90 123 45 67" inputmode="tel"></div>' +
          '<div class="field"><label>Izoh (ixtiyoriy)</label><input type="text" id="c_izoh" placeholder="Yetkazish manzili yoki izoh"></div>' +
          '<button type="submit" class="btn btn-primary btn-block" id="submitOrder" style="margin-top:8px">Buyurtma berish</button>' +
          '<div class="form-msg" id="orderMsg"></div>' +
        '</form>' +
        '<div class="success-box" id="successBox" style="display:none">' +
          '<div class="check">\u2713</div>' +
          '<h2>Buyurtmangiz qabul qilindi!</h2>' +
          '<p id="successText" style="color:var(--text-dim);margin:12px 0 24px"></p>' +
          '<a href="/" class="btn btn-primary">Katalogga qaytish</a>' +
        '</div>' +
      '</div>';

    if (typeof initPhoneMask === 'function') {
      var tel = document.getElementById('c_telefon');
      if (tel) initPhoneMask(tel);
    }
  }

  content.addEventListener('click', function(e) {
    var del = e.target.closest('[data-action="delete"]');
    if (del) {
      e.preventDefault();
      e.stopPropagation();
      removeFromCart(parseInt(del.dataset.id, 10));
      render();
      return;
    }
    handleStepperClick(e);
    var stepper = e.target.closest('.card-cart-stepper');
    if (stepper) {
      setTimeout(function() { render(); }, 100);
    }
  });

  content.addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitOrder');
    var msg = document.getElementById('orderMsg');
    msg.className = 'form-msg';
    btn.disabled = true;
    btn.textContent = 'Yuborilmoqda...';

    var cart = getCart();
    if (cart.length === 0) {
      msg.textContent = 'Savat bo\'sh';
      msg.className = 'form-msg show error';
      btn.disabled = false;
      btn.textContent = 'Buyurtma berish';
      return;
    }

    var tel = document.getElementById('c_telefon');
    if (typeof isValidPhone === 'function' && !isValidPhone(tel.value)) {
      msg.textContent = 'Telefon raqamini to\'liq kiriting (+998 XX XXX XX XX)';
      msg.className = 'form-msg show error';
      btn.disabled = false;
      btn.textContent = 'Buyurtma berish';
      return;
    }

    if (document.documentElement.classList.contains('store-closed')) {
      msg.textContent = 'Do\'kon hozir yopiq';
      msg.className = 'form-msg show error';
      btn.disabled = false;
      btn.textContent = 'Buyurtma berish';
      return;
    }

    var payload = {
      mijoz_ismi: document.getElementById('c_mijoz_ismi').value,
      telefon: tel.value,
      izoh: document.getElementById('c_izoh').value || undefined,
      items: cart.map(function(i) { return { product_id: i.product_id, miqdor: i.miqdor }; })
    };

    fetch('/api/v1/orders/bulk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, json: j }; }); })
    .then(function(result) {
      if (!result.ok || !result.json.success) throw new Error(result.json.error || 'Xatolik');
      var ids = result.json.data && result.json.data.order_ids ? result.json.data.order_ids : [];
      var txt = ids.length > 0 ? 'Buyurtma raqamlari: #' + ids.join(', #') : 'Buyurtmangiz qabul qilindi.';
      document.getElementById('successText').textContent = txt;
      clearCart();
      document.getElementById('orderFormWrap').style.display = 'none';
      document.getElementById('successBox').style.display = 'block';
    })
    .catch(function(err) {
      msg.textContent = err.message;
      msg.className = 'form-msg show error';
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = 'Buyurtma berish';
    });
  });

  async function init() {
    try {
      var res = await fetch('/api/v1/settings');
      var json = await res.json();
      if (json.success) {
        var s = json.data;
        var n = document.getElementById('storeName');
        if (n && s.dokon_nomi) n.textContent = s.dokon_nomi;
        var t = document.getElementById('storeTagline');
        if (t && s.qisqa_tavsif) t.textContent = s.qisqa_tavsif;
        var fn = document.getElementById('footerName');
        if (fn && s.dokon_nomi) fn.textContent = s.dokon_nomi;
        var theme = s.tema === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        try { localStorage.setItem('store-theme', theme); } catch (e) {}
        if (s.dokon_yopiq) document.documentElement.classList.add('store-closed');
      }
    } catch (e) {}
    render();
  }
  init();
})();
</script>
</body>
</html>
